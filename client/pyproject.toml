[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jdbc-proxy-client"
version = "1.1.0"
description = "Python client for jdbc-proxy: call JDBC drivers of any database through a small HTTP API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jdbc-proxy" }]
keywords = ["jdbc", "database", "proxy", "http", "mysql", "postgresql", "oracle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

# standard library only — nothing to install server-side
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["jdbc_proxy*"]

[tool.setuptools.package-data]
jdbc_proxy = ["py.typed"]
